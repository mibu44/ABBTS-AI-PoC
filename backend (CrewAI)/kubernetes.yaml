apiVersion: apps/v1
kind: Deployment
metadata:
  name: abbts-chat-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: abbts-chat-backend
  template:
    metadata:
      labels:
        app: abbts-chat-backend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: abbts-chat-backend:1.0
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TIMETABLE_MCP_URL
              value: http://stundenplan-mcp:8080/mcp
          envFrom:
            - secretRef:
                name: abbts-chat-backend
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: abbts-chat-backend
spec:
  selector:
    app: abbts-chat-backend
  ports:
    - port: 8000
      targetPort: http
