name: Build Campus Chat images in Kubernetes

on:
  workflow_dispatch:

concurrency:
  group: campus-chat-kubernetes
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_NAMESPACE: ${{ vars.K8S_BUILD_NAMESPACE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [[ -z "$KUBE_CONFIG" || -z "$BUILD_NAMESPACE" ]]; then
            echo "::error::Set the KUBE_CONFIG secret and K8S_BUILD_NAMESPACE repository variable before building."
            exit 1
          fi
          umask 077
          config="$RUNNER_TEMP/campus-chat-kubeconfig"
          printf '%s\n' "$KUBE_CONFIG" > "$config"
          echo "KUBECONFIG=$config" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start BuildKit in Kubernetes
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: kubernetes
          driver-opts: |
            namespace=${{ env.BUILD_NAMESPACE }}
            rootless=true

      - name: Build and publish all three images
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          # Keep local backend credentials out of the remote build context.
          printf '\n.env\n.env.*\n' >> 'backend (CrewAI)/.dockerignore'
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          while IFS='|' read -r component context; do
            docker buildx build --builder "$BUILDER" --push \
              --file "$context/Dockerfile" \
              --tag "$registry/$component:$GITHUB_SHA" \
              "$context"
          done <<'COMPONENTS'
          frontend|frontend (Campus Chat)
          backend|backend (CrewAI)
          stundenplan-mcp|mcp-stundenplan (Stundenplan-MCP)
          COMPONENTS

